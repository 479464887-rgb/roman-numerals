<!DOCTYPE html><html lang="en"><head>
<meta property="og:title" content="Roman Numerals — DevKit">
<meta property="og:description" content="Free online Roman Numerals tool — fast, simple, and no signup required.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://479464887-rgb.github.io/roman-numerals/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://479464887-rgb.github.io/roman-numerals/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Convert between Roman numerals and Arabic numbers"><title>Roman Numerals — DevKit Tools</title><style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--radius:6px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;}
.header a{color:var(--text);text-decoration:none;font-size:13px;}
.container{max-width:600px;margin:0 auto;padding:32px 24px;}
h1{font-size:24px;color:#f0f6fc;margin-bottom:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px;color:var(--text);font-size:18px;font-family:monospace;}
input:focus{outline:none;border-color:var(--accent);}
.btn{background:#238636;color:#fff;border:none;border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer;margin-top:8px;}
.result{font-size:24px;color:var(--accent);font-weight:600;padding:12px;text-align:center;min-height:40px;}
</style></head><body>
<div class="header"><a href="https://devkit-tools.xyz">← DevKit</a><span style="color:var(--text2);">Roman Numerals</span></div>
<div class="container"><h1>🏛️ Roman Numerals</h1>
<div class="card"><label>Arabic → Roman</label><input id="arabic" type="number" value="2024" min="1" max="3999" oninput="toRoman()"><div class="result" id="roman-out"></div></div>
<div class="card"><label>Roman → Arabic</label><input id="roman" value="MMXXIV" oninput="toArabic()"><div class="result" id="arabic-out"></div></div></div>
<script>
const v={M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
function toRoman(){let n=parseInt(document.getElementById('arabic').value)||0;if(n<1||n>3999){document.getElementById('roman-out').textContent='1-3999 only';return}let r='';for(const[k,val]of Object.entries(v)){while(n>=val){r+=k;n-=val}}document.getElementById('roman-out').textContent=r}
function toArabic(){const s=document.getElementById('roman').value.toUpperCase();let n=0;for(let i=0;i<s.length;i++){const c=v[s[i]]||0;const next=v[s[i+1]]||0;c<next?n-=c:n+=c}document.getElementById('arabic-out').textContent=n||'Invalid'}
toRoman();toArabic();
</script></body></html>
